# Blueprint de Render: New -> Blueprint y elige este repo.
services:
  - type: web
    name: alpr-api
    runtime: docker
    plan: free
    # La más cercana a Centroamérica
    region: virginia
    healthCheckPath: /health
    envVars:
      # Render genera un valor aleatorio; lo copias desde Environment
      - key: API_KEY
        generateValue: true
      # La de /propietarios; no va dentro de la app. En un Blueprint que ya
      # existe Render no la crea: se agrega a mano en Environment.
      - key: ADMIN_API_KEY
        generateValue: true
      # Cuando tengas el frontend publicado, pon aquí su dominio
      - key: CORS_ORIGENES
        value: "*"
      - key: GROQ_HABILITADO
        value: "false"
      # Render la pide al crear el Blueprint; déjala vacía si no usas Groq
      - key: GROQ_API_KEY
        sync: false
      # Vigilancia de iCloud Drive. Todas van con sync: false para que el
      # Blueprint no pise lo que se ponga en el panel (el código ya trae
      # ICLOUD_HABILITADO=false por default). En un Blueprint que ya existe
      # Render las ignora: se agregan a mano en Environment.
      - key: ICLOUD_HABILITADO
        sync: false
      # El enlace de la carpeta compartida
      - key: ICLOUD_CARPETA
        sync: false
      - key: ICLOUD_APPLE_ID
        sync: false
      - key: ICLOUD_PASSWORD
        sync: false
      # Postgres externo (ej. Neon): Render gratis no tiene disco
      - key: DATABASE_URL
        sync: false
