# Blueprint de Render: New -> Blueprint y elige este repo.
services:
  - type: web
    name: alpr-api
    runtime: docker
    plan: free
    # La más cercana a Centroamérica
    region: virginia
    healthCheckPath: /health
    envVars:
      # Render genera un valor aleatorio; lo copias desde Environment
      - key: API_KEY
        generateValue: true
      # Cuando tengas el frontend publicado, pon aquí su dominio
      - key: CORS_ORIGENES
        value: "*"
      - key: GROQ_HABILITADO
        value: "false"
      # Render la pide al crear el Blueprint; déjala vacía si no usas Groq
      - key: GROQ_API_KEY
        sync: false
      # Vigilancia de Google Drive. El webhook usa RENDER_EXTERNAL_URL solo.
      # Las tres van con sync: false para que el Blueprint no pise lo que se
      # ponga en el panel (el código ya trae DRIVE_HABILITADO=false por default).
      # En un Blueprint que ya existe Render las ignora: se agregan a mano en
      # Environment.
      - key: DRIVE_HABILITADO
        sync: false
      - key: DRIVE_CARPETA_ID
        sync: false
      # El JSON completo de la service account
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
